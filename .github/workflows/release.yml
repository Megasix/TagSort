name: Release

# Runs when a maintainer publishes a GitHub release tagged vX.Y.Z: builds the packages,
# publishes them to PyPI through trusted publishing (no stored password), and pushes the
# Docker image to the GitHub Container Registry.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Check that the tag matches the package version
        run: |
          version=$(uv run --no-project python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('src/tagsort/_version.py').read()).group(1))")
          test "v$version" = "${{ github.event.release.tag_name }}"
      - name: Build the sdist and wheel
        run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tagsort/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  docker:
    name: Publish the Docker image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/megasix/tagsort
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and push
        run: |
          version="${{ github.event.release.tag_name }}"
          version="${version#v}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -f docker/Dockerfile -t "$IMAGE:$version" -t "$IMAGE:latest" .
          docker push "$IMAGE:$version"
          docker push "$IMAGE:latest"
          docker build -f docker/Dockerfile.gpu -t "$IMAGE:$version-gpu" -t "$IMAGE:gpu" .
          docker push "$IMAGE:$version-gpu"
          docker push "$IMAGE:gpu"
