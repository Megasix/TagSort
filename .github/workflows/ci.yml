name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Check that uv.lock is up to date
        # uv ignores UV_FROZEN when --check is passed.
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format
        run: uv run ruff format --check .

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Mypy (strict)
        run: uv run mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-extras
      # The smallest model (6 MB) lets tests run the real recognizer. It is downloaded
      # explicitly, checked against its manifest SHA-256, and cached between runs.
      - name: Cache models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tagsort/models
          key: models-${{ hashFiles('src/tagsort/models/manifests/*.json') }}
      - name: Download the test model
        run: uv run tagsort models download ppocrv6-tiny
      - name: Pytest with coverage
        run: uv run pytest

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: docker build -f docker/Dockerfile -t tagsort .
      # The M6 exit criterion: read a folder with no Python installed on the host.
      - name: Read the reference images
        run: |
          python3 -c "import json; json.dump(json.load(open('reference/pipeline.v1.json'))['profile'], open('reference/profile.json', 'w'))"
          docker run --rm -v "$PWD/reference:/data:ro" tagsort read /data/images --profile /data/profile.json --model ppocrv6-tiny > out.jsonl
          python3 - <<'PY'
          import json
          lines = [json.loads(line) for line in open("out.jsonl")]
          texts = {line["file"].rsplit("/", 1)[-1]: [t["text"] for t in line["result"]["tags"]] for line in lines}
          print(texts)
          assert texts["upright.png"] == ["GJ07966"], texts
          assert texts["no_tag.png"] == [], texts
          assert len(lines) == 7
          PY
      - name: Serve and answer a request
        run: |
          docker run -d --name server -p 8000:8000 -e TAGSORT_API_TOKEN=ci-token tagsort
          for i in $(seq 1 30); do curl -sf localhost:8000/v1/health && break; sleep 1; done
          curl -sf -H "Authorization: Bearer ci-token" \
            -F image=@reference/images/upright.png -F "profile=<reference/profile.json" \
            localhost:8000/v1/read | tee response.json
          python3 -c "import json; tags = json.load(open('response.json'))['tags']; assert [t['text'] for t in tags] == ['GJ07966'], tags"
          test "$(curl -s -o /dev/null -w '%{http_code}' -F image=@reference/images/upright.png localhost:8000/v1/read)" = 401
          docker rm -f server

  license:
    name: License check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # Only what ships to users is checked: runtime dependencies and every extra.
      # Dev tools are never distributed (CLAUDE.md §5).
      - name: Install runtime dependencies and extras, without dev tools
        run: uv sync --no-dev --all-extras
      - name: Check licenses against the allowlist
        run: uv run --no-sync python .github/scripts/check_licenses.py
