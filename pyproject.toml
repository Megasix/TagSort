[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tagsort"
dynamic = ["version"]
description = "Open-source engine that reads handwritten or printed specimen ID tags in photos, in any orientation. Returns tag text, position, angle and a calibrated confidence score. Lightweight ONNX core, versioned JSON contracts and pluggable backends, built to embed in mobile, web and research apps."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Barry Lawson" }]
requires-python = ">=3.10"
dependencies = [
    "pillow>=11",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/Megasix/TagSort"
Issues = "https://github.com/Megasix/TagSort/issues"

[project.optional-dependencies]
# Vision API fallback providers (M2).
api = [
    "httpx>=0.28",
]
# HTTP server built on FastAPI (M6).
server = []
# PyTorch and training tools (M5). Never imported by the core.
train = []

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=2.4",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.16",
    "types-jsonschema>=4.26.0.20261006",
]

[tool.hatch.version]
path = "src/tagsort/_version.py"

[tool.hatch.build]
exclude = ["**/.gitkeep"]

[tool.hatch.build.targets.wheel]
packages = ["src/tagsort"]

[tool.hatch.build.targets.sdist]
include = [
    "src/tagsort",
    "tests",
    "schemas",
    "docs",
    "reference",
    "LICENSE",
    "NOTICE",
    "README.md",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# Code samples in CLAUDE.md are illustrative and aligned by hand.
extend-exclude = ["CLAUDE.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "D",    # pydocstyle
    "ANN",  # flake8-annotations
    "PT",   # flake8-pytest-style
    "N",    # pep8-naming
    "T20",  # no print statements
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["tagsort", "tests"]

[tool.ruff.lint.per-file-ignores]
# Tests feed arbitrary JSON documents to the loaders, so Any is the honest type there.
"tests/**" = ["D", "ANN401"]
".github/scripts/**" = ["T20"]
# Development tools print their reports.
"eval/**" = ["T20", "D102", "D103"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests", ".github/scripts", "eval"]
warn_unreachable = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--cov=tagsort",
    "--cov-report=term-missing",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["tagsort"]

[tool.coverage.report]
fail_under = 90
show_missing = true
